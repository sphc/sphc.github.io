name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 11.14.0
          cache: npm

      - name: Install Hexo CLI
        run: npm install --global hexo-cli@2.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          hexo clean
          hexo generate
          cp source/CNAME public/CNAME

      - name: Submit URLs to Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "BAIDU_PUSH_TOKEN is not set, skipping Baidu URL submission."
            exit 0
          fi
          curl -s -H 'Content-Type:text/plain' \
            --data-binary @public/baidu_urls.txt \
            "http://data.zz.baidu.com/urls?site=https://jkuvw.xyz&token=$BAIDU_PUSH_TOKEN"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
