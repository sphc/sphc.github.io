# Footer Settings
# ---------------
since: 2017

ICP:
  enable: false
  #text: 

# busuanzi count for PV / UV in site
busuanzi:
  # count values only if the other configs are false
  enable: true
  # custom uv span for the whole site
  site_uv: true
  site_uv_header: <i class="fa fa-user"></i>
  site_uv_footer:
  # custom pv span for the whole site
  site_pv: true
  site_pv_header: <i class="fa fa-eye"></i>
  site_pv_footer:
  # custom pv span for one page only
  page_pv: true
  page_pv_header: <i class="fa fa-file-o"></i>
  page_pv_footer:


# Sidebar Settings
# ---------------
links_title: Links
links:
  sphc: https://jkuvw.xyz
  #Name: url

theme_color:
  enable: true # or false -> to use the default theme
  main: "#61649f"
  paginator: "#1a94bc"
  button_hover: "#c04851"
  text_selection: "#1a94bc"
  link_color: "#99a9bf"
  hr_color: "#a7a8bd"
  meta_color: "#858585"

# code auto wrap
#code_word_wrap: true
